[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-session-guardian"
version = "0.1.0"
description = "Audits OAuth2/OIDC JWT configurations, token payloads, and HTTP Set-Cookie policies for alg: none bypasses, weak HMAC signing keys, missing exp/aud/iss claims, and absent HttpOnly, Secure, or SameSite flags."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "jwt-security",
    "session-security",
    "oauth2-security",
    "cookie-security",
    "authentication",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-session-guardian"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-session-guardian"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-session-guardian#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-session-guardian/issues"

[project.scripts]
lh-session = "lh_session_guardian.cli:app"
lh-session-guardian = "lh_session_guardian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_session_guardian"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

